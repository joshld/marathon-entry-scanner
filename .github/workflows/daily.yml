name: Daily marathon scan and publish
on:
  push:
    branches: [main]
    paths:
      - 'scanner/**'
      - 'tests/**'
      - 'site/**'
      - 'races.json'
      - 'requirements.txt'
      - '.github/workflows/daily.yml'
  schedule:
    - cron: '17 21 * * *' # 07:17 AEST (Brisbane)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: marathon-scanner
  cancel-in-progress: true
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test scanner enrichment
        run: python -m unittest discover -s tests -v
      - name: Scan and commit with conflict retry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Always scan the latest main branch, even if this run was queued
          # before another repository update.
          for attempt in 1 2 3 4; do
            git fetch origin main
            git checkout -B main origin/main
            python scanner/scan.py
            git add data/races.json data/history.json
            if git diff --cached --quiet; then
              echo "No scan-data changes."
              exit 0
            fi
            git commit -m 'data: daily marathon entry scan'
            if git push origin HEAD:main; then
              echo "Scan data published."
              exit 0
            fi
            echo "Push raced another update; rescanning the latest main (attempt $attempt)."
            sleep $((attempt * 3))
          done
          echo "Could not publish scan data after four attempts" >&2
          exit 1
  publish:
    needs: scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Refresh latest data from default branch
        run: |
          git fetch origin "${{ github.event.repository.default_branch }}"
          git checkout "origin/${{ github.event.repository.default_branch }}" -- data/races.json data/history.json
      - uses: actions/configure-pages@v5
      - name: Assemble static site
        run: |
          mkdir -p _site/data
          cp site/index.html _site/index.html
          cp data/races.json data/history.json _site/data/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
