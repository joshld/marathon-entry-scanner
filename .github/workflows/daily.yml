name: Daily marathon scan and publish
on:
  schedule:
    - cron: '17 21 * * *' # 07:17 AEST (Brisbane)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: marathon-scanner
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scanner/scan.py
      - name: Commit updated scan data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/races.json data/history.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: daily marathon entry scan'
            git push
          fi
  publish:
    needs: scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Refresh latest data from default branch
        run: |
          git fetch origin "${{ github.event.repository.default_branch }}"
          git checkout "origin/${{ github.event.repository.default_branch }}" -- data/races.json data/history.json
      - uses: actions/configure-pages@v5
      - name: Assemble static site
        run: |
          mkdir -p _site/data
          cp site/index.html _site/index.html
          cp data/races.json data/history.json _site/data/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
