name: Daily marathon scan and publish
on:
  push:
    branches: [main]
    paths:
      - 'scanner/**'
      - 'notifications/**'
      - 'subscriptions/**'
      - 'tests/**'
      - 'site/**'
      - 'races.json'
      - 'requirements.txt'
      - '.github/workflows/daily.yml'
  schedule:
    - cron: '17 21 * * *' # 07:17 AEST (Brisbane)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: marathon-scanner
  cancel-in-progress: true
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test scanner enrichment
        run: python -m unittest discover -s tests -v
      - name: Validate dashboard JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          from bs4 import BeautifulSoup
          soup = BeautifulSoup(Path("site/index.html").read_text(encoding="utf-8"), "html.parser")
          scripts = [tag.get_text() for tag in soup.find_all("script") if not tag.get("src")]
          assert len(scripts) == 1, "Expected one inline dashboard script"
          Path("/tmp/race-entry-dashboard.js").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/race-entry-dashboard.js
          cp subscriptions/worker.js /tmp/race-alerts-worker.mjs
          node --check /tmp/race-alerts-worker.mjs
      - name: Scan and commit with conflict retry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Always scan the latest main branch, even if this run was queued
          # before another repository update.
          for attempt in 1 2 3 4; do
            git fetch origin main
            git checkout -B main origin/main
            cp data/races.json /tmp/race-entry-before.json
            python scanner/scan.py
            python notifications/events.py /tmp/race-entry-before.json data/races.json
            git add data/races.json data/history.json data/alert-events.json
            if git diff --cached --quiet; then
              echo "No scan-data changes."
              exit 0
            fi
            git commit -m 'data: daily marathon entry scan'
            if git push origin HEAD:main; then
              echo "Scan data published."
              exit 0
            fi
            echo "Push raced another update; rescanning the latest main (attempt $attempt)."
            sleep $((attempt * 3))
          done
          echo "Could not publish scan data after four attempts" >&2
          exit 1
      - name: Send personalised alerts (scheduled runs only)
        if: github.event_name == 'schedule'
        env:
          EMAIL_ALERTS_ENABLED: ${{ vars.EMAIL_ALERTS_ENABLED }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          BREVO_LIST_ID: ${{ vars.BREVO_LIST_ID }}
          BREVO_SENDER_EMAIL: ${{ vars.BREVO_SENDER_EMAIL }}
          BREVO_UNSUBSCRIBE_BASE: ${{ vars.BREVO_UNSUBSCRIBE_BASE }}
          UNSUBSCRIBE_SECRET: ${{ secrets.UNSUBSCRIBE_SECRET }}
        run: python notifications/dispatch.py --send
  publish:
    needs: scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Refresh latest data from default branch
        run: |
          git fetch origin "${{ github.event.repository.default_branch }}"
          git checkout "origin/${{ github.event.repository.default_branch }}" -- data/races.json data/history.json
      - uses: actions/configure-pages@v5
      - name: Assemble static site
        run: |
          mkdir -p _site/data
          cp site/index.html site/alerts-config.json _site/
          cp data/races.json data/history.json _site/data/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
